on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "yarn"
      - name: Build App
        run: |
          yarn install --frozen-lockfile
          yarn build:win64
          yarn build-update
      - name: Create Release
        if: success()
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        if: success()
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps
          asset_path: ./build/app.zip
          asset_name: EndfieldPermitExport.zip
          asset_content_type: application/zip
      - name: Preserve gh-pages content
        if: success()
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          mkdir -p /tmp/gh-pages-preserve
          cp -r assets /tmp/gh-pages-preserve/ 2>/dev/null || true
          cp -r i18n /tmp/gh-pages-preserve/ 2>/dev/null || true
          git checkout ${{ github.ref_name }}

      - name: Merge preserved content into update dir
        if: success()
        run: |
          mkdir -p ./build/update/assets ./build/update/i18n
          cp -r /tmp/gh-pages-preserve/assets/* ./build/update/assets/ 2>/dev/null || true
          cp -r /tmp/gh-pages-preserve/i18n/* ./build/update/i18n/ 2>/dev/null || true

      - name: Deploy update
        if: success()
        uses: crazy-max/ghaction-github-pages@v2
        with:
          commit_message: Update app
          build_dir: ./build/update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
