name: Sync Ingame Data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  fetch-pools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Pool Data & Translations
        id: data_sync
        run: |
          node scripts/fetch_pools.js
          node scripts/update_i18n.js
          node scripts/download_icons.js
          node scripts/fetch_banners.js

          git add static/ src/i18n/ src/renderer/assets/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Skipping subsequent steps."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git commit -m "chore: update pool data and translations"
            git push
          fi

      - name: Stage CDN publish dir
        if: steps.data_sync.outputs.changed == 'true'
        run: |
          mkdir -p ./gh-pages-publish/assets
          mkdir -p ./gh-pages-publish/i18n
          cp -r src/renderer/assets/. ./gh-pages-publish/assets/
          cp src/i18n/*.json ./gh-pages-publish/i18n/

      - name: Mirror assets & i18n to gh-pages
        if: steps.data_sync.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-publish
          keep_files: true
          commit_message: "chore: update character icons, weapons, banners, and i18n translations"
